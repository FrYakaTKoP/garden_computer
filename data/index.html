<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tuttli9000 Garden Controller</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <div class="app">
    <header>
      <div>
        <h1>Tuttli9000</h1>
        <p>Garden controller • AP portal • irrigation automation</p>
      </div>
      <div class="header-actions">
        <button id="settings" class="secondary">Settings</button>
        <button id="refresh">Refresh</button>
      </div>
    </header>

    <section class="cards">
      <article class="card powerflow-card">
        <h3>Power Flow</h3>
        <div id="powerflow" class="powerflow">
          <div class="flow-col">
            <div class="flow-title">PV</div>
            <div id="pvVoltage" class="flow-line">--.--V</div>
            <div id="pvCurrent" class="flow-line">--.--A</div>
            <div id="pvPower" class="flow-line">--.--W</div>
          </div>
          <div class="flow-col">
            <div id="batteryState" class="flow-title">EMPTY</div>
            <div id="batteryVoltage" class="flow-line">--.--V</div>
            <div id="batteryCurrent" class="flow-line">--.--A</div>
            <div id="batteryPower" class="flow-line">--.--W</div>
            <div id="batteryTemp" class="flow-line">--.--C</div>
          </div>
          <div class="flow-col">
            <div class="flow-title">LOAD</div>
            <div id="loadVoltage" class="flow-line">--.--V</div>
            <div id="loadCurrent" class="flow-line">--.--A</div>
            <div id="loadPower" class="flow-line">--.--W</div>
          </div>
        </div>
      </article>
      <article class="card">
        <h3>PV Production</h3>
        <div id="production" class="value">--</div>
      </article>
      <article class="card">
        <h3>Time / Date</h3>
        <div id="clock" class="value">--</div>
      </article>
      <article class="card water-card">
        <h3>Tank States</h3>
        <div id="waterStates" class="tank-grid"></div>
      </article>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Automation Schedule</h2>
        <button id="add">Add Entry</button>
      </div>
      <div id="tablewrap"></div>
    </section>

    <section class="panel">
      <div id="formwrap" style="display:none"></div>
      <div id="settingswrap" style="display:none"></div>
    </section>
  </div>
  <script src="/app.js"></script>
</body>

</html>
