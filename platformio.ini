; PlatformIO project configuration for ESP32-S3 N16R8 (16MB flash)
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DARDUINO_ARCH_ESP32
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DRTC_ENABLED_DEFAULT=1
    -DRTC_DEBUG_DEFAULT=0
board_build.flash_size = 8MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
extra_scripts =
    post:scripts/pio_custom_targets.py

; Libraries (PlatformIO will fetch these)
lib_deps =
    bblanchon/ArduinoJson@^6.21.0
    ESP32Async/AsyncTCP@^3.3.2
    ESP32Async/ESPAsyncWebServer@^3.6.0
    olikraus/U8g2@^2.36.6

; Use the littlefs data uploader built into PlatformIO
board_upload.protocol = esptool